# Signal-IRC Bridge Configuration
# Copy this file and edit with your settings

[signal]
# URL of your signal-cli-rest-api instance
api_url = http://localhost:8080

# Your Signal phone number (the bot's number)
phone_number =

[irc]
# IRC server settings
server = 
port =

# SSL/TLS settings
use_ssl = true
verify_ssl = true

# Bot identity
nick = signalbridgebot
# Default IRC channel - used by any target that doesn't set its own channels
channel =

# Optional: server password (for password-protected servers)
password = 

# Optional: NickServ password for registered nicks
nickserv_password = 

[bridge]
# Prefix shown before Signal messages on IRC
signal_prefix = 

# Rate limiting: milliseconds between messages (prevents flooding)
rate_limit_ms = 300

# Forward all IRC messages to Signal without requiring bot nickname tag
forward_all_messages = false

# Mirror IRC messages across the channels of any target bound to several
# channels (IRC<->IRC). Off = each channel is independent.
mirror_channels = false

[admin]
masks = *!~user@your.host.com

# Target format:  id = [internal:X], [group], [channels:#a #b], [name]
#   channels:  bind this target to specific IRC channel(s), space-separated.
#              Omit to use the default [irc] channel above. List several to
#              mirror one Signal chat to multiple IRC channels.
[targets]
# Just the ID - relays to the default channel, sender's Signal name shown
+18005551212 =
# Contact with a nickname, bridged to a specific channel
+19008675309 = Jenny, channels:#jenny
# Group - need both the Group ID and the Internal ID; mirrored to two channels
group.VGhpcyBJcyBKdXN0IEFuIEV4YW1wbGUgQW5kIFNob3VsZCBOb3QgQgo= = internal:V2VsY29tZSBUbyBJbnRlcm5ldAo=, group, channels:#bridge-a #bridge-b
